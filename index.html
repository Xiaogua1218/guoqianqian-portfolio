  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}

  <script type="module">

    const canvas=document.querySelector('#wave'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200),renderer=new THREE.WebGLRenderer({canvas,antialias:true}),gridSize=40,cubeWidth=.8,cubeHeight=3,gap=.01,count=gridSize*gridSize,bounds=gridSize*(cubeWidth+gap),dummy=new THREE.Object3D(),clock3d=new THREE.Clock(),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),cameraTarget=new THREE.Vector2(),cameraLerp=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3(),trail=[],trailData=new Float32Array(128*4);
    let lastPoint=null;
    const trailTexture=new THREE.DataTexture(trailData,128,1,THREE.RGBAFormat,THREE.FloatType);trailTexture.minFilter=THREE.NearestFilter;trailTexture.magFilter=THREE.NearestFilter;trailTexture.generateMipmaps=false;trailTexture.needsUpdate=true;
    const uniforms={uTrailTexture:{value:trailTexture},uTrailCount:{value:0},uFadeTime:{value:2},uWaveSpeed:{value:6},uWaveFreq:{value:1.2},uWaveWidth:{value:3},uAmplitude:{value:.4},uJitter:{value:.2},uMaxHeight:{value:.4},uColorBase:{value:new THREE.Color('#ffffff')},uColorHigh:{value:new THREE.Color('#0055ff')}};
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.95;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.setClearColor('#808080');scene.background=new THREE.Color('#ffffff').multiplyScalar(.5);camera.up.set(0,0,-1);
    scene.add(new THREE.AmbientLight('#ffffff',.5));const light=new THREE.DirectionalLight('#ffffff',4);light.position.set(-20,10,6);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.radius=6;light.shadow.camera.near=.1;light.shadow.camera.far=60;light.shadow.camera.left=-22;light.shadow.camera.right=22;light.shadow.camera.top=22;light.shadow.camera.bottom=-22;light.shadow.bias=.0001;scene.add(light);const fill=new THREE.DirectionalLight('#ffffff',1);fill.position.set(10,5,-3);scene.add(fill);
    const waveVertex=shader=>shader.replace('#include <common>',`#include <common>\nvarying float vHeight;\nattribute vec2 aOffset;\nuniform sampler2D uTrailTexture; uniform int uTrailCount; uniform float uWaveSpeed; uniform float uWaveFreq; uniform float uWaveWidth; uniform float uFadeTime; uniform float uAmplitude; uniform float uJitter; uniform float uMaxHeight;\nvec2 hash2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453123)-.5;}` ).replace('#include <begin_vertex>',`#include <begin_vertex>\nvHeight=0.0;\nif(position.y>0.0){vec2 worldXZ=aOffset+hash2(aOffset)*uJitter;float waveHeight=0.0;float totalWeight=0.0;for(int i=0;i<128;i++){if(i>=uTrailCount)break;vec4 td=texture2D(uTrailTexture,vec2((float(i)+.5)/128.0,.5));float dist=length(worldXZ-td.rg);float relDist=dist-uWaveSpeed*td.b;float window=exp(-(relDist*relDist)/(uWaveWidth*uWaveWidth));float weight=exp(-td.b/uFadeTime)*window*(1.0/(1.0+dist*.1))*td.a;waveHeight+=weight*cos(uWaveFreq*relDist);totalWeight+=weight;}waveHeight/=max(totalWeight,1.0);float displacement=clamp(waveHeight*uAmplitude,-uMaxHeight,uMaxHeight);transformed.y+=displacement;vHeight=displacement;}`);
    const geometry=new THREE.BoxGeometry(cubeWidth,cubeHeight,cubeWidth),offsets=new THREE.InstancedBufferAttribute(new Float32Array(count*2),2);geometry.setAttribute('aOffset',offsets);const material=new THREE.MeshPhongMaterial({color:'#ffffff'});material.onBeforeCompile=shader=>{Object.assign(shader.uniforms,uniforms);shader.vertexShader=waveVertex(shader.vertexShader);shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>\nvarying float vHeight; uniform vec3 uColorBase; uniform vec3 uColorHigh; uniform float uMaxHeight;`).replace('#include <color_fragment>',`#include <color_fragment>\nfloat t=clamp(vHeight/uMaxHeight,0.0,1.0);diffuseColor.rgb=mix(uColorBase,uColorHigh,t);`)};
    const depthMaterial=new THREE.MeshDepthMaterial();depthMaterial.onBeforeCompile=shader=>{Object.assign(shader.uniforms,uniforms);shader.vertexShader=waveVertex(shader.vertexShader)};const grid=new THREE.InstancedMesh(geometry,material,count);grid.customDepthMaterial=depthMaterial;grid.castShadow=true;grid.receiveShadow=true;scene.add(grid);
    for(let row=0;row<gridSize;row++)for(let col=0;col<gridSize;col++){const index=row*gridSize+col,x=row*(cubeWidth+gap)-((gridSize-1)*(cubeWidth+gap))/2,z=col*(cubeWidth+gap)-((gridSize-1)*(cubeWidth+gap))/2;dummy.position.set(x,0,z);dummy.updateMatrix();grid.setMatrixAt(index,dummy.matrix);offsets.setXY(index,x,z)}grid.instanceMatrix.needsUpdate=true;offsets.needsUpdate=true;
    const vignetteRGB={uniforms:{tDiffuse:{value:null},shiftAmount:{value:.005},vignetteRadius:{value:.3},vignetteSoftness:{value:.3}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`uniform sampler2D tDiffuse;uniform float shiftAmount;uniform float vignetteRadius;uniform float vignetteSoftness;varying vec2 vUv;void main(){vec2 center=vec2(.5);float dist=distance(vUv,center);vec2 quadrant=sign(vUv-center);float vignetteFactor=smoothstep(vignetteRadius,vignetteRadius+vignetteSoftness,dist);float currentShift=shiftAmount*vignetteFactor;float r=texture2D(tDiffuse,vUv+currentShift*quadrant).r;float g=texture2D(tDiffuse,vUv).g;float b=texture2D(tDiffuse,vUv-currentShift*quadrant).b;gl_FragColor=vec4(vec3(r,g,b)*(1.0-vignetteFactor*.5),1.0);}`};
    const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new ShaderPass(vignetteRGB));composer.addPass(new OutputPass());
    function addTrail(event){pointer.set(event.clientX/innerWidth*2-1,-(event.clientY/innerHeight)*2+1);raycaster.setFromCamera(pointer,camera);if(!raycaster.ray.intersectPlane(plane,hit))return;const point={x:hit.x,z:hit.z,age:0,distDelta:0};if(lastPoint){point.distDelta=Math.hypot(point.x-lastPoint.x,point.z-lastPoint.z);if(point.distDelta<.1)return}trail.push(point);if(trail.length>128)trail.shift();lastPoint=point}
    function updateTrail(delta){for(let i=trail.length-1;i>=0;i--){trail[i].age+=delta;if(trail[i].age>8)trail.splice(i,1)}const live=Math.min(trail.length,128);for(let i=0;i<live;i++){const j=i*4,p=trail[i];trailData[j]=p.x;trailData[j+1]=p.z;trailData[j+2]=p.age;trailData[j+3]=p.distDelta}if(live||uniforms.uTrailCount.value){trailTexture.needsUpdate=true;uniforms.uTrailCount.value=live}}
    function updateCamera(){cameraLerp.x+=(cameraTarget.x-cameraLerp.x)*.04;cameraLerp.y+=(cameraTarget.y-cameraLerp.y)*.04;const alpha=cameraLerp.y*Math.PI*.03,beta=cameraLerp.x*Math.PI*.05;camera.position.set(-12*Math.cos(alpha)*Math.sin(beta),12*Math.cos(alpha)*Math.cos(beta),12*Math.sin(alpha));camera.lookAt(0,0,0)}
    function update(){const delta=Math.min(clock3d.getDelta(),.05);updateTrail(delta);updateCamera();composer.render();requestAnimationFrame(update)}
    function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));composer.setPixelRatio(Math.min(devicePixelRatio,1.5))}function tick(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true})+' CN'}
    document.body.addEventListener('pointerenter',()=>document.body.classList.add('wave-active'));document.body.addEventListener('pointermove',event=>{cameraTarget.set(event.clientX/innerWidth*2-1,-(event.clientY/innerHeight)*2+1);addTrail(event)});document.body.addEventListener('pointerleave',()=>{document.body.classList.remove('wave-active');lastPoint=null});addEventListener('resize',resize);tick();setInterval(tick,10000);setTimeout(()=>document.body.classList.add('ready'),160);update();
